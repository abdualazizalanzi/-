<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>عهدة الأقسام والقاعات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;600;700&display=swap">
<style>
/* Layout: sticky header with department switcher + tabs; content column max 1180px; door-plate room cards */
:root{
  --bg:#F2F4F3; --surface:#FFFFFF; --sunk:#F7F9F8; --ink:#16231F; --muted:#5B6964; --line:#DCE3E0;
  --accent:#0F6B5A; --accent-ink:#FFFFFF; --accent-soft:#E0EEEA;
  --warn:#9A5B00; --warn-soft:#FBF0DC; --danger:#B3261E; --danger-soft:#FBE4E2; --ok:#2E7D4F;
  --plate:#1D2B27; --plate-ink:#F2F4F3;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#161F1C; --sunk:#121a17; --ink:#E5ECE9; --muted:#9AA8A3; --line:#29352F;
  --accent:#53C2A7; --accent-ink:#06201A; --accent-soft:#163029;
  --warn:#E5AC4F; --warn-soft:#33280F; --danger:#F08A80; --danger-soft:#3A1A17; --ok:#6BCB8F;
  --plate:#E5ECE9; --plate-ink:#0E1412; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#161F1C; --sunk:#121a17; --ink:#E5ECE9; --muted:#9AA8A3; --line:#29352F;
  --accent:#53C2A7; --accent-ink:#06201A; --accent-soft:#163029;
  --warn:#E5AC4F; --warn-soft:#33280F; --danger:#F08A80; --danger-soft:#3A1A17; --ok:#6BCB8F;
  --plate:#E5ECE9; --plate-ink:#0E1412; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.6;font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding-block:14px 10px}
.brand h1{font-family:var(--f-display);font-size:20px;font-weight:700;margin:0;text-wrap:balance}
.brand .sub{color:var(--muted);font-size:13px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,input,textarea,button{font:inherit;color:inherit}
select,input[type=text],input[type=number],input[type=search]{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
select:focus-visible,input:focus-visible,button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.small{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.status{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.status.local{background:var(--warn-soft);color:var(--warn)}
.status.ro{background:var(--danger-soft);color:var(--danger)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:0}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 14px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
nav.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--accent)}
main{padding-block:22px 60px;display:grid;gap:22px}
h2{font-family:var(--f-display);font-size:17px;font-weight:600;margin:0}
.sec-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.hint{color:var(--muted);font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .lab{color:var(--muted);font-size:13px;letter-spacing:.01em}
.kpi .val{font-family:var(--f-display);font-size:30px;font-weight:600;line-height:1.2}
.kpi .cmp{font-size:12px;color:var(--muted)}
.kpi .cmp b{color:var(--ink);font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:22px}
.grid2>*{min-width:0}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:minmax(0,9.5rem) 1fr 3rem;gap:10px;align-items:center;font-size:13px}
.bar .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .track{height:12px;background:var(--sunk);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.bar .fill{height:100%;background:var(--accent);border-radius:6px}
.bar .fill.none{background:var(--warn)}
.bar .n{text-align:left;font-weight:600}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle}
th{background:var(--sunk);font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap;position:sticky;top:0}
tr:last-child td{border-bottom:0}
td.num{text-align:center}
td input{width:100%;border:1px solid transparent;background:transparent;padding:5px 7px;border-radius:6px}
td input:hover{border-color:var(--line)}
td input:focus{border-color:var(--accent);background:var(--surface)}
td input.qty{width:5.5rem;text-align:center}
td input.code{width:6.5rem}
td input.unit{width:5rem}
td input.loc{min-width:11rem}
td input.nm{min-width:16rem}
.chip{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--sunk);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.ok{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.room{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.plate{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;background:var(--plate);color:var(--plate-ink)}
.plate .t{font-size:12px;opacity:.75;letter-spacing:.04em}
.plate .no{font-family:var(--f-display);font-size:26px;font-weight:700;letter-spacing:.06em;direction:ltr}
.plate select{background:transparent;color:var(--plate-ink);border-color:color-mix(in srgb,var(--plate-ink) 30%,transparent);padding:3px 8px;font-size:13px}
.plate select option{color:#16231F;background:#fff}
.room .body{padding:12px 14px;display:grid;gap:10px}
.counts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.counts label{display:grid;gap:2px;font-size:12px;color:var(--muted)}
.counts input{width:100%;text-align:center;font-weight:600;font-size:16px;padding:5px}
.room .foot{display:flex;flex-wrap:wrap;gap:6px;justify-content:space-between;align-items:center;padding:10px 14px;border-top:1px solid var(--line);background:var(--sunk)}
.room details summary{cursor:pointer;font-size:13px;color:var(--accent)}
.room ul{margin:6px 0 0;padding-inline-start:18px;font-size:13px}
.room input.rname{width:100%}
.ritems{border:1px solid var(--line);border-radius:8px}
.ritems .rh{font-size:12px;color:var(--muted);background:var(--sunk);padding:6px 10px;border-bottom:1px solid var(--line)}
.ritems .ri{display:flex;justify-content:space-between;gap:10px;padding:7px 10px;font-size:13.5px;line-height:1.5;border-bottom:1px solid var(--line)}
.ritems .ri:last-child{border-bottom:0}
.ritems .rn{min-width:0;flex:1}
.rooms{align-items:start}
.ritems .rq{font-weight:600;white-space:nowrap}
.addrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.addrow input{width:8rem}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted);background:var(--surface)}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:26px;text-align:center;background:var(--sunk);cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop input{display:none}
.form{display:grid;gap:12px}
.form .row{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.form label.f{display:grid;gap:4px;font-size:13px;color:var(--muted);min-width:min(100%,240px);flex:1}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline:16px;margin-inline:auto;max-width:420px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;text-align:center;z-index:20}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar input[type=search]{flex:1;min-width:min(100%,220px)}
.att li{margin-block:4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 11px;cursor:pointer;font-size:13px;color:var(--muted)}
.seg button+button{border-inline-start:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.stat{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:5px 8px;display:flex;justify-content:space-between;gap:6px;font-size:12px;color:var(--muted)}
.stat b{color:var(--ink);font-size:15px}
.stat.zero b{color:var(--muted);font-weight:400}
.capr{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.capr input{width:5.5rem;text-align:center}
.ritems .ri{align-items:center}
.ritems .ri input{width:4.2rem;text-align:center;padding:3px 4px}
.ritems .acts{display:flex;gap:6px;align-items:center;white-space:nowrap}
.allocadd{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px;background:var(--sunk);border-top:1px solid var(--line)}
.allocadd select{flex:1;min-width:0;width:100%;font-size:13px;padding:5px 6px}
.allocadd input{width:4.5rem;text-align:center;padding:5px}
.chip.bad{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.plate .no.txt{font-size:19px;letter-spacing:0}
.jump{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.jump a{font-size:13px;color:var(--ink);text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px}
.jump a b{color:var(--accent);margin-inline-start:4px}
.rsec{display:grid;gap:12px;scroll-margin-top:120px}
.rsec>.sec-head{margin-bottom:0;padding-top:10px;border-top:1px solid var(--line)}
.plate .who{font-size:15px;font-weight:600;margin-top:2px}
.plate .who.none{opacity:.6;font-weight:400;font-size:13px}
.room.office .plate{background:var(--accent);color:var(--accent-ink)}
.room.office .plate select{color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent-ink) 35%,transparent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fl{display:grid;gap:2px;font-size:12px;color:var(--muted);min-width:0}
.fl input{width:100%}
.offices{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:12px}
.ocard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:4px}
.otop{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.onum{font-family:var(--f-display);font-weight:600;color:var(--accent)}
.oname{font-size:17px;font-weight:600}
.oname.none{color:var(--warn);font-size:14px;font-weight:500}
tr.tot td{background:var(--accent-soft)}
.allocadd{display:grid;gap:6px;padding:8px 10px;background:var(--sunk);border-top:1px solid var(--line)}
.pk{position:relative}
.pk input{width:100%;font-size:14px;padding:7px 10px}
.pkdrop{margin-top:4px;background:var(--surface);border:1px solid var(--accent);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);max-height:300px;overflow:auto}
.pkt{font-size:13px}
.pkt th{position:sticky;top:0;background:var(--sunk);padding:6px 8px}
.pkt td{padding:6px 8px;cursor:pointer;line-height:1.45}
.pkt td.c{text-align:center;white-space:nowrap}
.pkt tr[data-pick-item]:hover td,.pkt tr[data-pick-item]:focus td{background:var(--accent-soft)}
.pkt tr[data-pick-item]:focus{outline:none}
.pkempty{padding:12px;color:var(--muted);font-size:13px;text-align:center}
.pksel{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;background:var(--accent-soft);border:1px solid var(--accent);border-radius:8px;padding:6px 8px;font-size:13px}
.pksel .c{white-space:nowrap;font-weight:600}
.pksel .n{min-width:0}
.pksel .btn{padding:2px 8px}
.pkrow{display:flex;gap:6px}
.pkrow input{width:6rem;text-align:center;padding:5px}
.pkrow .btn{flex:1}
.rtab{font-size:13px}
.rtab th{background:var(--surface);padding:5px 6px;font-size:12px}
.rtab td{padding:5px 6px;line-height:1.45}
.rtab td.c{text-align:center;white-space:nowrap;width:1%}
.rtab td input{width:3.8rem;text-align:center;padding:3px 4px;border:1px solid var(--line)}
.footl{display:flex;gap:10px;align-items:center}
.printbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:10px}
.printbar .pl{font-weight:600}
.printbar select{flex:1;min-width:min(100%,220px)}
@media (prefers-reduced-motion:no-preference){.bar .fill{transition:width .4s ease}}
</style>
<style>html{color-scheme:light}body{margin:0;font-family:var(--f-body);font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>


<div id="app" dir="rtl">
  <header class="top">
    <div class="wrap">
      <div class="topbar">
        <div class="brand">
          <h1>عهدة الأقسام والقاعات</h1>
          <div class="sub" id="subline">جارٍ تحميل البيانات المحفوظة…</div>
        </div>
        <div class="controls">
          <select id="deptSel" aria-label="القسم"></select>
          <div class="seg" id="themeSeg" role="group" aria-label="المظهر"><button data-theme-set="light">نهاري</button><button data-theme-set="dark">ليلي</button><button data-theme-set="auto">تلقائي</button></div>
          <span class="status" id="saveStatus">جارٍ الاتصال…</span>
        </div>
      </div>
      <nav class="tabs" role="tablist" id="tabs">
        <button role="tab" data-tab="overview" aria-selected="true">نظرة عامة</button>
        <button role="tab" data-tab="rooms" aria-selected="false">القاعات والمكاتب</button>
        <button role="tab" data-tab="items" aria-selected="false">أصناف العهدة</button>
        <button role="tab" data-tab="io" aria-selected="false">Excel والنسخ الاحتياطي</button>
        <button role="tab" data-tab="depts" aria-selected="false">الأقسام</button>
      </nav>
    </div>
  </header>
  <main class="wrap" id="main">
    <div class="empty">جارٍ تحميل البيانات المحفوظة. إذا كانت هذه أول مرة، ابدأ من تبويب «استيراد وتصدير» وارفع ملف Excel.</div>
  </main>
</div>
<div class="toast" id="toast" dir="rtl" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>

<script>
(() => {
try { document.documentElement.setAttribute("dir", "rtl"); document.documentElement.setAttribute("lang", "ar"); } catch {}
const ROOM_TYPES = ["قاعة","معمل","ورشة","مكتب مدرب","غرفة مدربين","مستودع","غرفة سيرفرات","غرفة بيانات","مكتب","أخرى"];
const SECTIONS = [
  {key:"halls", title:"القاعات والمعامل", types:["قاعة","معمل","ورشة"], ph:"رقم القاعة، مثل 20005"},
  {key:"offices", title:"مكاتب المدربين", types:["مكتب مدرب","غرفة مدربين"], ph:"اسم المكتب، مثل مكتب 6"},
  {key:"other", title:"المستودع وغرفة السيرفرات وغرف أخرى", types:["مستودع","غرفة سيرفرات","غرفة بيانات","مكتب","أخرى"], ph:"اسم الغرفة، مثل المستودع"}];
const sectionOf = t => SECTIONS.find(s => s.types.includes(t)) || SECTIONS[2];
const isOffice = r => sectionOf(r.type).key === "offices";
const CATS = [["tables","طاولات متدربين"],["chairs","كراسي متدربين"],["computers","أجهزة حاسب"],["screens","شاشات"],["projectors","أجهزة عرض"],["boards","سبورات"]];
const COUNT_FIELDS = [["capacity","السعة"], ...CATS];
const LS_KEY = "inv-dash-v1";
const S = { depts:{}, rooms:{}, items:{} };
const ui = { cur: "all", tab: "overview", q: "", noLoc: false, confirm: null, imp: null, restore: null, busy: false, mode: "loading", readOnly: false, pending: 0, pick: {room:null, q:"", sel:null, open:false} };
let db = null, downloads = null, api = false;
const STANDALONE = !(window.claude && window.claude.use);
const canSave = () => !!downloads || STANDALONE;
async function saveFile(filename, data, type){
  if (downloads) return downloads.save({filename, data});
  const blob = data instanceof Blob ? data : new Blob([data], {type: type || "application/octet-stream"});
  const url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  return {status:"saved"};
}
async function apiCall(method, path, body){
  const r = await fetch("api/" + path, {method, headers: body ? {"Content-Type":"application/json"} : {}, body: body ? JSON.stringify(body) : undefined, cache:"no-store"});
  if (!r.ok) throw {code: r.status === 403 ? "invalid_argument" : "unavailable"};
  return r.status === 204 ? null : r.json();
}
let apiVersion = null;
async function apiLoad(){
  const d = await apiCall("GET", "all");
  apiVersion = d.version;
  for (const col of ["depts","rooms","items"]) { S[col] = d[col] || {}; S["_"+col] = true; }
  schedule();
}
async function apiPoll(){
  if (ui.pending || document.hidden) return;
  try { const v = await apiCall("GET", "version"); if (v.version !== apiVersion) await apiLoad(); } catch {}
}

try { const t = localStorage.getItem("inv-ui"); if (t) Object.assign(ui, JSON.parse(t)); } catch {}
ui.confirm = null; ui.imp = null; ui.restore = null; ui.busy = false; ui.pending = 0;
const saveUi = () => { try { localStorage.setItem("inv-ui", JSON.stringify({cur:ui.cur, tab:ui.tab})); } catch {} };

/* ---------- theme ---------- */
function applyTheme(t){
  const root = document.documentElement;
  if (t === "light" || t === "dark") root.setAttribute("data-theme", t); else root.removeAttribute("data-theme");
  document.querySelectorAll("#themeSeg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.themeSet === (t || "auto"))));
}
let theme = "auto"; try { theme = localStorage.getItem("inv-theme") || "auto"; } catch {}
applyTheme(theme);

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { const n = Number(String(v ?? "").replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/,/g, "")); return isFinite(n) ? n : 0; };
const fmt = n => Number(n || 0).toLocaleString("ar-SA-u-nu-latn");
const safe = s => String(s).replace(/[^A-Za-z0-9_.~:@+-]/g, "_").slice(0, 120) || "x";
const rid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const norm = s => String(s ?? "").replace(/\s+/g, " ").trim();
const roomId = (dept, n) => /^[A-Za-z0-9_.-]+$/.test(n) ? dept + "-r-" + n : rid(dept + "-r-");

function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 3400); }

/* ---------- classification ---------- */
function category(name){
  const n = String(name || "");
  if (/جهاز عرض|بروجكتر|بروجيكتر|داتا شو/.test(n)) return "projectors";
  if (/سبور/.test(n)) return "boards";
  if (/طاول/.test(n)) return /مدرب|مدرس|شاي/.test(n) ? null : "tables";
  if (/كرسي|كراسي/.test(n)) return /مدرب|انتظار|زائر|طبي/.test(n) ? null : "chairs";
  if (/شاشة/.test(n)) return "screens";
  if (/كمبيوتر|حاسب/.test(n) && !/طابعة|تحكم|راسم/.test(n)) return "computers";
  return null;
}
const roomNums = loc => (String(loc || "").match(/\d{4,6}/g) || []);
function extractRooms(items){
  const found = {};
  for (const it of items){
    const loc = norm(it.loc); if (!loc) continue;
    const re = /(قاعة|معمل|ورشة|مختبر|مستودع)?\s*-?\s*(\d{4,6})/g; let m, lastType = null;
    while ((m = re.exec(loc))){ if (m[1]) lastType = m[1] === "مختبر" ? "معمل" : m[1]; const t = lastType || "قاعة"; if (!found[m[2]]) found[m[2]] = t; }
  }
  return found;
}

/* ---------- allocation: item.alloc = {roomId: qty} ---------- */
const allocOf = it => (it && it.alloc && typeof it.alloc === "object") ? it.alloc : {};
const allocated = it => Object.entries(allocOf(it)).reduce((a,[rid,n]) => a + (S.rooms[rid] ? num(n) : 0), 0);
const avail = it => num(it.qty) - allocated(it);
function roomAllocs(rid){
  const out = [];
  for (const [id, it] of Object.entries(S.items)){ const n = num(allocOf(it)[rid]); if (n > 0) out.push({id, it, n}); }
  return out.sort((a,b) => (a.it.name||"").localeCompare(b.it.name||"", "ar"));
}
function roomCounts(rid){
  const c = {}; CATS.forEach(([f]) => c[f] = 0);
  roomAllocs(rid).forEach(({it, n}) => { const k = category(it.name); if (k) c[k] += n; });
  return c;
}
/* Distribute items whose «مكان التواجد» names rooms: one room gets all; several rooms split evenly when it divides. */
function autoAllocPlan(items, rooms){
  const byNum = {}; rooms.forEach(r => byNum[String(r.num)] = r.id);
  const labs = rooms.filter(r => r.type === "معمل").map(r => r.id);
  const plan = [];
  for (const it of items){
    if (Object.keys(allocOf(it)).some(k => S.rooms[k] || rooms.some(r => r.id === k))) continue;
    let targets = roomNums(it.loc).map(n => byNum[n]).filter(Boolean);
    if (!targets.length && byNum[norm(it.loc)]) targets = [byNum[norm(it.loc)]];
    if (!targets.length && /جميع المعامل/.test(it.loc || "")) targets = labs;
    if (!targets.length) continue;
    const q = num(it.qty); if (q <= 0 || q % targets.length) continue;
    const alloc = {}; targets.forEach(t => alloc[t] = q / targets.length);
    plan.push([it, alloc]);
  }
  return plan;
}

/* ---------- storage ---------- */
function saveLocal(){ try { localStorage.setItem(LS_KEY, JSON.stringify({depts:S.depts, rooms:S.rooms, items:S.items})); } catch {} }
function loadLocal(){ try { const d = JSON.parse(localStorage.getItem(LS_KEY) || "null"); if (d) Object.assign(S, d); } catch {} }
function setStatus(){
  const el = $("#saveStatus");
  if (ui.mode === "loading") { el.className = "status"; el.textContent = "جارٍ الاتصال…"; return; }
  if (ui.readOnly) { el.className = "status ro"; el.textContent = "عرض فقط"; return; }
  if (ui.pending) { el.className = "status"; el.textContent = "جارٍ الحفظ…"; return; }
  if (ui.mode === "db" || ui.mode === "api") { el.className = "status"; el.textContent = ui.mode === "api" ? "✓ محفوظ على الخادم" : "✓ محفوظ"; }
  else { el.className = "status local"; el.textContent = "محفوظ في هذا المتصفح فقط"; }
}
async function write(col, id, data){
  if (ui.readOnly) { toast("لا تملك صلاحية التعديل على هذه اللوحة."); return false; }
  if (data === null) delete S[col][id]; else S[col][id] = data;
  if (!db && !api){ saveLocal(); schedule(); return true; }
  ui.pending++; setStatus(); schedule();
  const run = api
    ? () => apiCall(data === null ? "DELETE" : "PUT", encodeURIComponent(col) + "/" + encodeURIComponent(id), data === null ? undefined : data).then(r => { if (r && r.version) apiVersion = r.version; })
    : () => { const ref = db.collection(col).doc(id); return data === null ? ref.delete() : ref.set(data); };
  try { await run(); return true; }
  catch (e) {
    if (e && e.code === "invalid_argument") { ui.readOnly = true; toast("لم يُحفظ التعديل: صلاحيتك على هذه اللوحة للعرض فقط."); }
    else if (e && e.code === "quota_exceeded") toast("امتلأت مساحة الحفظ. احذف بعض السجلات ثم أعد المحاولة.");
    else { await new Promise(r => setTimeout(r, 600 + Math.random()*600)); try { await run(); return true; } catch { toast("تعذّر الحفظ. أعد المحاولة."); } }
    return false;
  } finally { ui.pending--; setStatus(); }
}
async function writeMany(ops, onProgress){
  let done = 0; const queue = ops.slice();
  async function worker(){ while (queue.length){ const [c,i,d] = queue.shift(); await write(c,i,d); done++; onProgress && onProgress(done, ops.length); } }
  await Promise.all(Array.from({length: Math.min(8, ops.length)}, worker));
}
async function initStore(){
  try { if (window.claude && window.claude.use) db = await window.claude.use("db"); } catch { db = null; }
  try { if (window.claude && window.claude.use) downloads = await window.claude.use("downloads"); } catch { downloads = null; }
  if (db){
    ui.mode = "db";
    try { const user = await window.claude.use("user"); if (user){ const c = await user.can("data.write"); if (c === false) ui.readOnly = true; } } catch {}
    for (const col of ["depts","rooms","items"]){
      db.collection(col).onSnapshot(snap => {
        const o = {}; snap.docs.forEach(d => { if (d.exists) o[d.id] = d.data(); }); S[col] = o; S["_"+col] = true; schedule();
      }, err => { if (err && err.code === "revoked") { ui.readOnly = true; schedule(); } });
    }
  } else {
    try { const r = await fetch("api/ping", {cache:"no-store"}); api = r.ok && (await r.json()).ok === true; } catch { api = false; }
    if (api){
      ui.mode = "api";
      try { await apiLoad(); } catch { api = false; }
      if (api) setInterval(apiPoll, 15000);
    }
    if (!api){ ui.mode = "local"; loadLocal(); S._depts = S._rooms = S._items = true; }
  }
  setStatus(); schedule();
}

}

function pickMatches(pool, q){
  q = norm(q);
  if (!q) return pool;
  const digits = /^\d+$/.test(q);
  const scored = [];
  for (const it of pool){
    const code = String(it.code || ""), name = String(it.name || "");
    let s = -1;
    if (code === q) s = 0; else if (code.startsWith(q)) s = 1; else if (!digits && name.includes(q)) s = 2; else if (code.includes(q)) s = 3;
    if (s >= 0) scored.push([s, it]);
  }
  return scored.sort((a,b) => a[0] - b[0]).map(x => x[1]);
}
function pickerHtml(r, pool){
  const e = esc(r.id), p = ui.pick, mine = p.room === r.id;
  const sel = mine && p.sel && S.items[p.sel] ? {id:p.sel, ...S.items[p.sel]} : null;
  const list = mine && p.open && !sel ? pickMatches(pool, p.q).slice(0, 40) : [];
  return `<div class="allocadd">
    <div class="pk">

async function printForms(places){

    fr.setAttribute("aria-hidden", "true");

    document.body.appendChild(fr);
    const doc = fr.contentWindow.document; doc.open(); doc.write(printHtml(places, true)); doc.close();

    return;
  }

  const name = places.length === 1 ? `عهدة ${places[0].title}` : `نماذج العهدة ${stamp()}`;
  try { await saveFile(name.replace(/[\\/:*?"<>|]/g, "-") + ".html", printHtml(places), "text/html"); toast("افتح الملف ليظهر لك أمر الطباعة مباشرة."); }
  catch (e) {

    places.forEach(p => { let n = p.title.replace(/[\\/?*\[\]:]/g, " ").slice(0, 28) || "موقع"; let k = n, i = 2; while (used.has(k)) k = n.slice(0, 25) + " " + i++; used.add(k);

      XLSX.utils.book_append_sheet(wb, ws, k); });
    wb.Workbook = {Views:[{RTL:true}]};
    saveXlsx(wb, name + ".xlsx");
  }
}

/* ---------- import ---------- */
function findCol(hdr, res){ for (const re of res){ const i = hdr.findIndex(h => re.test(h)); if (i >= 0) return i; } return -1; }
function parseWorkbook(wb, fileName){
  const out = { file:fileName, items:[], rooms:[], sheets:[], name:"", college:"", target:"__new", mode:"merge", makeRooms:true };
  for (const sn of wb.SheetNames){
    if (/^_|ملخص|مكاتب المدربين/.test(sn)) continue;
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], {header:1, defval:"", raw:false});
    let hi = rows.findIndex(r => r.some(c => /الصنف/.test(c)) && r.some(c => /العدد|الرصيد|الكمية|الإجمالي/.test(c)));
    if (hi >= 0 && !/توزيع/.test(sn)){
      for (const r of rows.slice(0, hi)) for (const c of r){ const t = norm(c); if (!t) continue; if (!out.name && /قسم/.test(t)){ const p = t.split(/\s[—–-]\s/); out.name = p[0]; if (p[1] && !out.college) out.college = p.slice(1).join(" - "); } }
      const h = rows[hi].map(norm);
      const c = { code: findCol(h,[/رقم الصنف/,/كود|الرمز/]), name: findCol(h,[/^الصنف$/,/اسم الصنف|وصف الصنف/,/الصنف/]), qty: findCol(h,[/العدد|الرصيد|الكمية|الإجمالي/]), unit: findCol(h,[/الوحدة/]), loc: findCol(h,[/مكان|الموقع|التواجد/]) };
      if (c.code === c.name) c.code = -1;
      let n = 0;
      for (const r of rows.slice(hi+1)){
        const name = c.name>=0 ? norm(r[c.name]) : ""; if (!name) continue;
        out.items.push({ code: c.code>=0 ? norm(r[c.code]) : "", name, qty: c.qty>=0 ? num(r[c.qty]) : 0, unit: c.unit>=0 ? norm(r[c.unit]) : "", loc: c.loc>=0 ? norm(r[c.loc]) : "" }); n++;
      }
      out.sheets.push(`${sn} (${n} صنف)`); continue;
    }
    hi = rows.findIndex(r => r.some(c => /رقم القاعة|^القاعة$|رقم المعمل/.test(norm(c))));
    if (hi >= 0 && !/توزيع/.test(sn)){
      const h = rows[hi].map(norm);
      const c = { num: findCol(h,[/رقم القاعة|رقم المعمل|^القاعة$/]), type: findCol(h,[/النوع/]), name: findCol(h,[/الاسم|الوصف/]), capacity: findCol(h,[/السعة/]), notes: findCol(h,[/ملاحظ/]) };
      let n = 0;
      for (const r of rows.slice(hi+1)){
        const rn = norm(r[c.num]); if (!rn) continue;
        out.rooms.push({ num: rn, type: ROOM_TYPES.includes(norm(r[c.type])) ? norm(r[c.type]) : "قاعة", name: c.name>=0 ? norm(r[c.name]) : "", capacity: c.capacity>=0 ? num(r[c.capacity]) : 0, notes: c.notes>=0 ? norm(r[c.notes]) : "" }); n++;
      }
      out.sheets.push(`${sn} (${n} قاعة)`);
    }
  }
  if (!out.name) out.name = fileName.replace(/\.[^.]+$/, "").replace(/[_-]+/g, " ").trim() || "قسم جديد";
  const match = deptList().find(d => norm(d.name) === norm(out.name));
  if (match) out.target = match.id;
  return out;
}
async function handleFile(file){
  if (!file) return;
  if (!window.XLSX){ toast("تعذّر تحميل قارئ ملفات Excel. أعد تحميل الصفحة."); return; }
  try {
    const wb = XLSX.read(await file.arrayBuffer(), {type:"array"});
    if (wb.Sheets["_backup"]){ const o = backupFromWorkbook(wb); if (o){ ui.restore = {depts:o.depts||{}, rooms:o.rooms||{}, items:o.items||{}, savedAt:o.savedAt}; ui.tab = "io"; schedule(); toast("هذا ملف نسخة احتياطية. راجع الاسترداد بالأسفل."); return; } }
    const p = parseWorkbook(wb, file.name);
    if (!p.items.length && !p.rooms.length){ toast("لم أجد أعمدة الأصناف أو القاعات في هذا الملف. تأكد من وجود عمود «الصنف» وعمود «العدد»."); return; }
    ui.imp = p; ui.tab = "io"; schedule();
  } catch { toast("تعذّر قراءة الملف. جرّب حفظه بصيغة xlsx."); }
}
async function doImport(){
  const imp = ui.imp; if (!imp || ui.busy) return;
  let deptId = imp.target;
  const ops = [];
  if (deptId === "__new"){
    const name = norm($("#impName") ? $("#impName").value : imp.name) || "قسم جديد";
    const college = norm($("#impCollege") ? $("#impCollege").value : imp.college);
    deptId = rid("d"); ops.push(["depts", deptId, {name, college, createdAt: new Date().toISOString()}]);
  } else if (imp.mode === "replace"){
    Object.entries(S.items).forEach(([id,i]) => { if (i.dept === deptId) ops.push(["items", id, null]); });
  }
  const seen = {}, existingByCode = {};
  Object.entries(S.items).forEach(([id,i]) => { if (i.dept === deptId && i.code) existingByCode[i.code] = id; });
  const newItems = [];
  for (const it of imp.items){
    let id = it.code && imp.mode !== "replace" ? existingByCode[it.code] : null;
    const keep = id && S.items[id] ? {alloc: allocOf(S.items[id])} : {};
    if (!id) id = it.code ? deptId + "-i-" + safe(it.code) : rid(deptId + "-i-");
    if (seen[id]) id = rid(deptId + "-i-"); seen[id] = 1;
    const rec = {...keep, ...it, dept: deptId};
    newItems.push([id, rec]);
  }
  const roomsAll = Object.entries(S.rooms).filter(([,r]) => r.dept === deptId).map(([id,r]) => ({id, ...r}));
  const byNum = {}; roomsAll.forEach(r => byNum[String(r.num)] = r.id);
  const newRooms = [];
  for (const r of imp.rooms){ const id = byNum[r.num] || roomId(deptId, r.num); const base = S.rooms[id] || {}; byNum[r.num] = id; newRooms.push({id, ...base, ...r, dept: deptId}); }
  if (imp.makeRooms){
    const found = extractRooms(newItems.map(x => x[1]));
    for (const [n, t] of Object.entries(found)) if (!byNum[n]) { const id = roomId(deptId, n); byNum[n] = id; newRooms.push({id, num:n, type:t, name:"", notes:"", capacity:0, dept:deptId}); }
    const plan = autoAllocPlan(newItems.map(([id, rec]) => rec), [...roomsAll.filter(r => !newRooms.some(x => x.id === r.id)), ...newRooms]);
    plan.forEach(([rec, alloc]) => { rec.alloc = alloc; });
  }
  newRooms.forEach(r => { const {id, ...d} = r; ops.push(["rooms", id, d]); });
  newItems.forEach(([id, rec]) => { const del = ops.findIndex(o => o[0]==="items" && o[1]===id); if (del >= 0) ops.splice(del, 1); ops.push(["items", id, rec]); });
  ui.busy = "جارٍ الحفظ 0 / " + ops.length; schedule();
  await writeMany(ops, (d, t) => { ui.busy = `جارٍ الحفظ ${d} / ${t}`; schedule(); });
  ui.busy = false; ui.imp = null; ui.cur = deptId; ui.tab = "overview"; saveUi(); schedule();
  toast(`تم استيراد ${imp.items.length} صنف وحفظها.`);
}

/* ---------- Excel (styled) ---------- */
const XB = {top:{style:"thin",color:{rgb:"C9D3CF"}},bottom:{style:"thin",color:{rgb:"C9D3CF"}},left:{style:"thin",color:{rgb:"C9D3CF"}},right:{style:"thin",color:{rgb:"C9D3CF"}}};
const XF = "Arial";
function styledSheet({title, subtitle, headers, rows, widths, numCols = [], totals = null}){
  const aoa = [[title], [subtitle || ""], [], headers, ...rows];
  if (totals) aoa.push(totals);
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  const nC = headers.length, hr = 3, last = aoa.length - 1;
  ws["!merges"] = [{s:{r:0,c:0}, e:{r:0,c:nC-1}}, {s:{r:1,c:0}, e:{r:1,c:nC-1}}];
  ws["!cols"] = widths.slice(0, nC).map(w => ({wch:w}));
  ws["!rows"] = [{hpt:26},{hpt:18},{hpt:6},{hpt:24}];
  const set = (r, c, st) => { const ref = XLSX.utils.encode_cell({r, c}); if (!ws[ref]) ws[ref] = {t:"s", v:""}; ws[ref].s = st; };
  set(0, 0, {font:{name:XF, sz:15, bold:true, color:{rgb:"16231F"}}, alignment:{horizontal:"right", vertical:"center", readingOrder:2}});
  set(1, 0, {font:{name:XF, sz:10, color:{rgb:"5B6964"}}, alignment:{horizontal:"right", readingOrder:2}});
  for (let c = 0; c < nC; c++) set(hr, c, {font:{name:XF, sz:11, bold:true, color:{rgb:"FFFFFF"}}, fill:{patternType:"solid", fgColor:{rgb:"0F6B5A"}}, alignment:{horizontal:"center", vertical:"center", wrapText:true, readingOrder:2}, border:XB});
  for (let r = hr + 1; r <= last; r++){
    const isTot = totals && r === last, zebra = (r - hr) % 2 === 0;
    for (let c = 0; c < nC; c++){
      const isNum = numCols.includes(c);
      set(r, c, {font:{name:XF, sz:11, bold:!!isTot}, fill:{patternType:"solid", fgColor:{rgb: isTot ? "D5EAE4" : zebra ? "F3F7F6" : "FFFFFF"}}, alignment:{horizontal: isNum ? "center" : "right", vertical:"center", wrapText:!isNum, readingOrder:2}, border:XB});
    }
  }
  if (rows.length) ws["!autofilter"] = {ref: XLSX.utils.encode_range({s:{r:hr,c:0}, e:{r: hr + rows.length, c:nC-1}})};
  return ws;
}
function buildWorkbook({all, withBackup}){
  const items = itemsCur(), rooms = roomsCur(), halls = rooms.filter(r => !isOffice(r)), offices = rooms.filter(isOffice);

  const sub = `تاريخ التصدير: ${today}`;
  const wb = XLSX.utils.book_new();

  const sumH = f => halls.reduce((a,r) => a + (f === "capacity" ? num(r.capacity) : counts[r.id][f]), 0);
  const totalQty = items.reduce((a,i) => a + num(i.qty), 0), totalAl = items.reduce((a,i) => a + allocated(i), 0);
  const sumRows = [["عدد الأقسام", all ? deptList().length : 1], ["أصناف العهدة", items.length], ["إجمالي القطع", totalQty], ["قطع موزّعة على القاعات والمكاتب", totalAl], ["قطع متبقية في الإجمالي", totalQty - totalAl],
    ["القاعات والمعامل", halls.length], ["مكاتب المدربين", offices.length], ["السعة الاستيعابية", sumH("capacity")], ...CATS.map(([f,l]) => [l + " في القاعات", sumH(f)])];
  XLSX.utils.book_append_sheet(wb, styledSheet({title: head, subtitle: sub, headers:["البند","العدد"], rows: sumRows, widths:[38,14], numCols:[1]}), "ملخص");
  const ih = ["م","رقم الصنف","الصنف","العدد / الرصيد","في القاعات","المتبقي","الوحدة","مكان التواجد"].concat(all ? ["القسم"] : []);
  const ir = items.map((i,ix) => [ix+1, i.code, i.name, num(i.qty), allocated(i), avail(i), i.unit, i.loc].concat(all ? [deptName(i.dept)] : []));
  XLSX.utils.book_append_sheet(wb, styledSheet({title: head, subtitle: "عهدة القسم · " + sub, headers: ih, rows: ir, widths:[5,11,48,12,11,10,8,30,26], numCols:[0,1,3,4,5],
    totals: ["","","الإجمالي", totalQty, totalAl, totalQty - totalAl, "", ""].concat(all ? [""] : [])}), "حصر الأصناف");
  const rh = ["رقم القاعة","النوع","الاسم / الوصف", ...COUNT_FIELDS.map(c => c[1]), "عدد الأصناف","ملاحظات"].concat(all ? ["القسم"] : []);
  const rr = halls.map(r => [r.num, r.type, r.name||"", num(r.capacity), ...CATS.map(([f]) => counts[r.id][f]), roomAllocs(r.id).length, r.notes||""].concat(all ? [deptName(r.dept)] : []));
  XLSX.utils.book_append_sheet(wb, styledSheet({title: "القاعات والمعامل", subtitle: head, headers: rh, rows: rr, widths:[14,10,22,9,12,12,11,9,10,9,10,24,24], numCols:[3,4,5,6,7,8,9,10],
    totals: ["الإجمالي","","", ...COUNT_FIELDS.map(([f]) => sumH(f)), "", ""].concat(all ? [""] : [])}), "القاعات والمعامل");
  const oh = ["المكتب","اسم المدرب","الموقع / الدور","التحويلة","العهدة","عدد القطع","ملاحظات"].concat(all ? ["القسم"] : []);
  const or = offices.map(r => { const al = roomAllocs(r.id); return [r.num, r.person || "", r.name || "", r.ext || "", al.map(x => `${x.it.name} (${x.n})`).join("\n"), al.reduce((a,x)=>a+x.n,0), r.notes || ""].concat(all ? [deptName(r.dept)] : []); });
  XLSX.utils.book_append_sheet(wb, styledSheet({title: "مكاتب المدربين", subtitle: head, headers: oh, rows: or, widths:[14,24,16,10,52,9,22,24], numCols:[3,5]}), "مكاتب المدربين");
  const dr = []; rooms.forEach(r => roomAllocs(r.id).forEach(({it, n}) => dr.push([r.num, r.type, isOffice(r) ? (r.person||"") : "", it.code, it.name, n, it.unit])));
  XLSX.utils.book_append_sheet(wb, styledSheet({title: "توزيع الأصناف", subtitle: head, headers:["القاعة / المكتب","النوع","المدرب","رقم الصنف","الصنف","العدد","الوحدة"], rows: dr, widths:[16,12,20,11,48,8,8], numCols:[3,5]}), "توزيع الأصناف");
  if (withBackup){
    const json = JSON.stringify({app:"inventory-dashboard", version:3, savedAt:new Date().toISOString(), depts:S.depts, rooms:S.rooms, items:S.items});
    const chunks = []; for (let i = 0; i < json.length; i += 30000) chunks.push([json.slice(i, i + 30000)]);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([["لا تعدّل هذه الورقة: تُستخدم لاسترداد البيانات"], ...chunks]), "_backup");
  }
  wb.Workbook = {Views:[{RTL:true}], Sheets: wb.SheetNames.map(n => ({name:n, Hidden: n === "_backup" ? 1 : 0}))};
  return wb;
}
async function saveXlsx(wb, filename){

  catch (e) { if (!e || e.code !== "declined") toast("تعذّر التنزيل. أعد المحاولة."); }

function backupFromWorkbook(wb){
  const ws = wb.Sheets["_backup"]; if (!ws) return null;
  const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:"", raw:true});
  const o = JSON.parse(rows.slice(1).map(r => String(r[0] || "")).join(""));
  return (o && o.items && o.depts) ? o : null;
}
async function readRestore(file){
  if (!file) return;
  try {
    let o = null;
    if (/\.json$/i.test(file.name)) o = JSON.parse(await file.text());
    else o = backupFromWorkbook(XLSX.read(await file.arrayBuffer(), {type:"array"}));
    if (!o || typeof o !== "object" || !o.items || !o.depts) throw 0;
    ui.restore = {depts:o.depts||{}, rooms:o.rooms||{}, items:o.items||{}, savedAt:o.savedAt}; ui.tab = "io"; schedule();
  } catch { toast("هذا الملف ليس نسخة احتياطية من هذه اللوحة. النسخة الاحتياطية تُنزَّل من زر «تنزيل نسخة احتياطية»."); }
}
async function doRestore(){

/* ---------- allocation actions ---------- */
async function setAlloc(itemId, rId, n){
  const it = S.items[itemId]; if (!it) return;
  const cur = num(allocOf(it)[rId]);
  const maxN = cur + avail(it);
  if (n > maxN){ toast(`المتبقي من «${it.name}» ${fmt(maxN - cur)} فقط.`); schedule(); return; }
  const alloc = {...allocOf(it)};
  if (n > 0) alloc[rId] = n; else delete alloc[rId];
  await write("items", itemId, {...it, alloc});
}

  if (t.id === "restoreIn"){ readRestore(t.files[0]); t.value = ""; return; }
  if (t.id === "noLoc"){ ui.noLoc = t.checked; schedule(); return; }
  if (t.id === "impTarget" && ui.imp){ ui.imp.target = t.value; schedule(); return; }
  if (t.name === "impMode" && ui.imp){ ui.imp.mode = t.value; return; }
  if (t.id === "impRooms" && ui.imp){ ui.imp.makeRooms = t.checked; return; }
  if (t.id === "impName" && ui.imp){ ui.imp.name = t.value; return; }
  if (t.id === "impCollege" && ui.imp){ ui.imp.college = t.value; return; }
  if (t.dataset.allocItem){ setAlloc(t.dataset.allocItem, t.dataset.allocRoom, Math.max(0, Math.floor(num(t.value)))); return; }
  const col = t.dataset.col, id = t.dataset.id, f = t.dataset.f;
  if (col && id && f && S[col][id]){
    const v = t.dataset.num ? num(t.value) : norm(t.value);
    if (S[col][id][f] === v) return;
    write(col, id, {...S[col][id], [f]: v});
  }
});
function exactCode(roomIdV, q){ const r = S.rooms[roomIdV]; if (!r || !norm(q)) return null; const qq = norm(q); const same = Object.values(S.items).filter(it => it.dept === r.dept && avail(it) > 0 && String(it.code || "").startsWith(qq)); if (same.length !== 1 || String(same[0].code) !== qq) return null; const hit = Object.entries(S.items).find(([,it]) => it === same[0]); return hit ? hit[0] : null; }
function choosePick(roomIdV, itemId){ const it = S.items[itemId]; if (!it) return; ui.pick = {room:roomIdV, q:String(it.code || it.name), sel:itemId, open:false}; schedule(); setTimeout(() => { const q = document.getElementById(`add-${roomIdV}-qty`); if (q){ q.focus(); q.select(); } }, 30); }
document.addEventListener("input", e => {
  if (e.target.id === "q"){ ui.q = e.target.value; schedule(); return; }
  const pr = e.target.dataset && e.target.dataset.pick;
  if (pr){ const q = e.target.value; const ex = exactCode(pr, q); ui.pick = {room:pr, q, sel:null, open:true}; if (ex) { choosePick(pr, ex); return; } schedule(); }
});
document.addEventListener("focusin", e => { const pr = e.target.dataset && e.target.dataset.pick; if (pr && !(ui.pick.room === pr && ui.pick.open)){ ui.pick = {room:pr, q: ui.pick.room === pr ? ui.pick.q : "", sel: ui.pick.room === pr ? ui.pick.sel : null, open: !(ui.pick.room === pr && ui.pick.sel)}; schedule(); } });
document.addEventListener("mousedown", e => {
  const row = e.target.closest && e.target.closest("[data-pick-item]");
  if (row){ e.preventDefault(); choosePick(row.dataset.room, row.dataset.pickItem); return; }
  if (ui.pick.open && !(e.target.closest && e.target.closest(".pk"))){ ui.pick.open = false; schedule(); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.matches("td input, .capr input, .rname, .ri input, .fl input")) { e.target.blur(); }
  if (e.key === "Enter" && e.target.id && /^newRoom(Num|Person)-/.test(e.target.id)) { e.preventDefault(); act("addRoom", e.target.id.split("-")[1]); }
  if (e.key === "Enter" && e.target.id === "newDept") { e.preventDefault(); act("addDept"); }
  if (e.key === "Enter" && e.target.id && /^add-.*-qty$/.test(e.target.id)) { e.preventDefault(); act("alloc", e.target.id.slice(4, -4)); }
  const pr = e.target.dataset && e.target.dataset.pick;
  if (pr && e.key === "Escape"){ ui.pick.open = false; schedule(); }
  if (pr && e.key === "Enter"){ e.preventDefault(); const r = S.rooms[pr]; const pool = Object.entries(S.items).map(([k,it]) => ({id:k, ...it})).filter(it => it.dept === r.dept && avail(it) > 0); const m = pickMatches(pool, e.target.value); if (m.length) choosePick(pr, m[0].id); else toast("لا يوجد صنف بهذا الرقم له رصيد متبقٍ."); }
  if (pr && e.key === "ArrowDown"){ const first = document.querySelector(`[data-pick-item][data-room="${pr}"]`); if (first){ e.preventDefault(); first.focus(); } }
  const prow = e.target.dataset && e.target.dataset.pickItem;
  if (prow && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); choosePick(e.target.dataset.room, prow); }
  if (prow && (e.key === "ArrowDown" || e.key === "ArrowUp")){ e.preventDefault(); const sib = e.key === "ArrowDown" ? e.target.nextElementSibling : e.target.previousElementSibling; if (sib) sib.focus(); else if (e.key === "ArrowUp") { const pk = document.getElementById("pk-" + e.target.dataset.room); if (pk) pk.focus(); } }
});
document.addEventListener("click", e => {
  const th = e.target.closest("[data-theme-set]");
  if (th){ theme = th.dataset.themeSet; try { localStorage.setItem("inv-theme", theme); } catch {} applyTheme(theme); return; }
  const tab = e.target.closest("#tabs button");
  if (tab){ ui.tab = tab.dataset.tab; ui.confirm = null; saveUi(); schedule(); return; }
  const b = e.target.closest("[data-act]"); if (!b) return;
  act(b.dataset.act, b.dataset.id, b.dataset.v);
});
const drop = e => e.target.closest && e.target.closest("#drop");
document.addEventListener("dragover", e => { const d = drop(e); if (d){ e.preventDefault(); d.classList.add("over"); } });
document.addEventListener("dragleave", e => { const d = drop(e); if (d) d.classList.remove("over"); });
document.addEventListener("drop", e => { const d = drop(e); if (d){ e.preventDefault(); d.classList.remove("over"); handleFile(e.dataTransfer.files[0]); } });

async function act(a, id, v){
  const arm = key => { if (ui.confirm === key) { ui.confirm = null; return true; } ui.confirm = key; schedule(); setTimeout(() => { if (ui.confirm === key){ ui.confirm = null; schedule(); } }, 4000); return false; };
  switch (a){
    case "tab": ui.tab = v; saveUi(); schedule(); break;
    case "noloc": ui.tab = "items"; ui.noLoc = true; saveUi(); schedule(); break;
    case "open": ui.cur = id; ui.tab = "overview"; saveUi(); schedule(); break;
    case "addDept": { const n = norm($("#newDept") && $("#newDept").value); if (!n){ toast("اكتب اسم القسم أولًا."); return; } const nid = rid("d"); if (await write("depts", nid, {name:n, college:"", createdAt:new Date().toISOString()})){ ui.cur = nid; saveUi(); toast("تمت إضافة القسم."); } break; }
    case "delDept": { if (!arm("delDept:"+id)) return; const ops = [["depts",id,null]]; Object.entries(S.items).forEach(([k,i]) => i.dept===id && ops.push(["items",k,null])); Object.entries(S.rooms).forEach(([k,r]) => r.dept===id && ops.push(["rooms",k,null])); if (ui.cur===id) ui.cur="all"; await writeMany(ops); toast("تم حذف القسم."); break; }
    case "addRoom": { const sec = SECTIONS.find(x => x.key === id) || SECTIONS[0];
      const n = norm($("#newRoomNum-" + sec.key) && $("#newRoomNum-" + sec.key).value);
      const person = norm($("#newRoomPerson-" + sec.key) && $("#newRoomPerson-" + sec.key).value);
      const type = $("#newRoomType-" + sec.key) ? $("#newRoomType-" + sec.key).value : sec.types[0];
      let name = n;
      if (!name && sec.key === "offices"){ let k = Object.values(S.rooms).filter(r => r.dept===ui.cur && sectionOf(r.type)===sec).length + 1; while (Object.values(S.rooms).some(r => r.dept===ui.cur && r.num === "مكتب " + k)) k++; name = "مكتب " + k; }
      if (!name){ toast("اكتب رقم القاعة أو اسم الغرفة أولًا."); return; }
      if (Object.values(S.rooms).some(r => r.dept===ui.cur && String(r.num)===name)){ toast("هذا الاسم مسجّل مسبقًا."); return; }
      await write("rooms", roomId(ui.cur, name), {num:name, type, person, name:"", notes:"", dept:ui.cur, capacity:0}); toast(`تمت إضافة ${name}.`); break; }
    case "extractRooms": {
      const items = Object.entries(S.items).filter(([,i]) => i.dept===ui.cur).map(([id,i]) => ({id, ...i}));
      const found = extractRooms(items); const have = new Set(Object.values(S.rooms).filter(r => r.dept===ui.cur).map(r => String(r.num)));
      const ops = Object.entries(found).filter(([n]) => !have.has(n)).map(([n,t]) => ["rooms", roomId(ui.cur, n), {num:n, type:t, name:"", notes:"", capacity:0, dept:ui.cur}]);
      const rooms = [...Object.entries(S.rooms).filter(([,r]) => r.dept===ui.cur).map(([id,r]) => ({id, ...r})), ...ops.map(([,id,d]) => ({id, ...d}))];
      const plan = autoAllocPlan(items, rooms);
      plan.forEach(([it, alloc]) => { const {id: iid, ...rest} = it; ops.push(["items", iid, {...rest, alloc}]); });
      if (!ops.length){ toast("لا يوجد شيء جديد للتوزيع حسب المواقع."); return; }
      await writeMany(ops); toast(`أُنشئت ${ops.length - plan.length} قاعة ووُزّع ${plan.length} صنف.`); break; }
    case "alloc": {
      const qn = document.getElementById(`add-${id}-qty`);
      let itemId = ui.pick.room === id ? ui.pick.sel : null;
      if (!itemId && ui.pick.room === id){ const r = S.rooms[id]; const pool = Object.entries(S.items).map(([k,it]) => ({id:k, ...it})).filter(it => it.dept === r.dept && avail(it) > 0); const m = pickMatches(pool, ui.pick.q); if (m.length === 1 || (m[0] && String(m[0].code) === norm(ui.pick.q))) itemId = m[0].id; }
      if (!itemId){ toast("اكتب رقم الصنف أو اختره من الجدول."); const pk = document.getElementById("pk-" + id); if (pk) pk.focus(); return; }
      const it = S.items[itemId]; const n = Math.floor(num(qn && qn.value) || 1);
      if (n <= 0){ toast("اكتب العدد."); return; }
      const before = num(allocOf(it)[id]);
      await setAlloc(itemId, id, before + n);
      if (num(allocOf(S.items[itemId])[id]) !== before){ toast(`أُضيف ${fmt(n)} × ${it.name}`); ui.pick = {room:id, q:"", sel:null, open:false}; schedule(); setTimeout(() => { const pk = document.getElementById("pk-" + id); if (pk) pk.focus(); }, 60); }
      break; }
    case "unpick": ui.pick = {room:id, q:"", sel:null, open:true}; schedule(); setTimeout(() => { const pk = document.getElementById("pk-" + id); if (pk) pk.focus(); }, 30); break;
    case "print": { const r = S.rooms[id]; if (!r) return; printForms(printPlaces().filter(p => p.key === "r:" + id)); break; }
    case "printSel": { const v = $("#printSel") && $("#printSel").value; const all = printPlaces(); printForms(v === "__all" ? all : all.filter(p => p.key === v)); break; }
    case "ret": { if (!arm("ret:" + v + ":" + id)) return; await setAlloc(id, v, 0); toast("تم الاسترداد إلى الإجمالي."); break; }
    case "delRoom": { if (!arm("delRoom:"+id)) return;
      const ops = Object.entries(S.items).filter(([,it]) => allocOf(it)[id] !== undefined).map(([k,it]) => { const alloc = {...allocOf(it)}; delete alloc[id]; return ["items", k, {...it, alloc}]; });
      ops.push(["rooms", id, null]); await writeMany(ops); toast("حُذفت القاعة ورجعت أصنافها للإجمالي."); break; }
    case "addItem": { const nid = rid(ui.cur + "-i-"); ui.q = ""; ui.noLoc = false; await write("items", nid, {code:"", name:"", qty:0, unit:"عدد", loc:"", dept:ui.cur}); setTimeout(() => { const el = document.getElementById(`f-items-${nid}-code`); if (el) { el.focus(); el.scrollIntoView({block:"center"}); } }, 120); break; }
    case "delItem": if (!arm("delItem:"+id)) return; await write("items", id, null); break;
    case "doImport": doImport(); break;
    case "cancelImport": ui.imp = null; schedule(); break;
    case "backup": backup(); break;
    case "doRestore": doRestore(); break;
    case "cancelRestore": ui.restore = null; schedule(); break;
    case "export": exportNow(); break;
    case "template": exportTemplate(); break;
  }
}

render();
initStore();
})();
</script>
